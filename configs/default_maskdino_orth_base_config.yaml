_BASE_: coco/instance-segmentation/Base-COCO-InstanceSegmentation.yaml

MODEL:
  META_ARCHITECTURE: "MaskDINO"
  SEM_SEG_HEAD:
    NAME: "MaskDINOHead"
    IGNORE_VALUE: 255
    LOSS_WEIGHT: 1.0
    CONVS_DIM: 256
    MASK_DIM: 256
    NORM: "GN"
    PIXEL_DECODER_NAME: "MaskDINOEncoder"
    DIM_FEEDFORWARD: 1024
    TOTAL_NUM_FEATURE_LEVELS: 3
    IN_FEATURES: ["res2", "res3", "res4", "res5"]
    DEFORMABLE_TRANSFORMER_ENCODER_IN_FEATURES: ["res3", "res4", "res5"]
    COMMON_STRIDE: 4
    TRANSFORMER_ENC_LAYERS: 3
    FEATURE_ORDER: "low2high"
  MaskDINO:
    TRANSFORMER_DECODER_NAME: "MaskDINODecoder"
    DEEP_SUPERVISION: True
    NO_OBJECT_WEIGHT: 1.0
    CLASS_WEIGHT: 4.0
    MASK_WEIGHT: 0.0
    DICE_WEIGHT: 0.0
    BOX_WEIGHT: 5.0
    GIOU_WEIGHT: 2.0
    COST_MASK_WEIGHT: 0.0
    COST_DICE_WEIGHT: 0.0
    HIDDEN_DIM: 256
    NUM_OBJECT_QUERIES: 30
    NHEADS: 8
    DROPOUT: 0.0
    DIM_FEEDFORWARD: 1024
    ENFORCE_INPUT_PROJ: False
    SIZE_DIVISIBILITY: 32
    DEC_LAYERS: 6
    TRAIN_NUM_POINTS: 12544
    OVERSAMPLE_RATIO: 3.0
    IMPORTANCE_SAMPLE_RATIO: 0.75
    INITIAL_PRED: True
    TWO_STAGE: True
    DN: "standard"
    DN_NUM: 50
    INITIALIZE_BOX_TYPE: "bitmask"
    TEST:
      SEMANTIC_ON: False
      INSTANCE_ON: True
      PANOPTIC_ON: False

INPUT:
  DATASET_MAPPER_NAME: "coco_instance_detr"
  # Shared with Mask R-CNN so comparisons use the same image geometry.
  MIN_SIZE_TRAIN:
  - 640
  - 800
  - 1024
  MAX_SIZE_TRAIN: 1333
  MIN_SIZE_TEST: 800
  MAX_SIZE_TEST: 1333
  MASK_FORMAT: polygon

DATALOADER:
  NUM_WORKERS: 4
  REPEAT_THRESHOLD: 0.2
  KEEP_NEGATIVE_RATIO: 0.2

ORTH_CLASS_BALANCE:
  ENABLED: true
  BETA: 0.99
  CLIP_MIN: 0.25
  CLIP_MAX: 2.0
  FOCAL_GAMMA: 2.0

ORTH_AUGMENTATION:
  ENABLED: true
  HORIZONTAL_FLIP_PROB: 0.5
  ROTATION_PROB: 0.3
  ROTATION_ANGLE: 7.0
  COLOR_PROB: 0.2
  BRIGHTNESS_MIN: 0.85
  BRIGHTNESS_MAX: 1.15
  CONTRAST_MIN: 0.90
  CONTRAST_MAX: 1.10
  SATURATION_MIN: 0.90
  SATURATION_MAX: 1.10
  GAMMA_PROB: 0.2
  GAMMA_MIN: 0.90
  GAMMA_MAX: 1.10
  QUALITY_PROB: 0.2
  BLUR_SIGMA_MIN: 0.10
  BLUR_SIGMA_MAX: 0.80
  JPEG_QUALITY_MIN: 75
  JPEG_QUALITY_MAX: 100

DISTRIBUTED:
  NUM_GPUS: 2
  IMS_PER_GPU: 1

SOLVER:
  AMP:
    ENABLED: True
  BASE_LR: 0.00025
  MAX_ITER: 12000
  STEPS:
  - 8000
  - 11000
  GAMMA: 0.1
  WARMUP_ITERS: 500

TEST:
  EVAL_PERIOD: 1000

LOGGER: wandb
WANDB:
  PROJECT: maskdino
  ENTITY: "intraoral"

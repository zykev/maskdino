# MaskDINO / caries (single-tooth instance segmentation, masks ON).
#
# Task-level settings only. Every variant in this folder adds its own backbone
# and pretraining block on top.
_BASE_: ../../coco/instance-segmentation/Base-COCO-InstanceSegmentation.yaml

MODEL:
  META_ARCHITECTURE: "MaskDINO"
  SEM_SEG_HEAD:
    NAME: "MaskDINOHead"
    IGNORE_VALUE: 255
    LOSS_WEIGHT: 1.0
    CONVS_DIM: 256
    MASK_DIM: 256
    NORM: "GN"
    PIXEL_DECODER_NAME: "MaskDINOEncoder"
    DIM_FEEDFORWARD: 1024
    TOTAL_NUM_FEATURE_LEVELS: 3
    IN_FEATURES: ["res2", "res3", "res4", "res5"]
    DEFORMABLE_TRANSFORMER_ENCODER_IN_FEATURES: ["res3", "res4", "res5"]
    COMMON_STRIDE: 4
    TRANSFORMER_ENC_LAYERS: 6
  MaskDINO:
    TRANSFORMER_DECODER_NAME: "MaskDINODecoder"
    DEEP_SUPERVISION: True
    NO_OBJECT_WEIGHT: 1.0
    CLASS_WEIGHT: 4.0
    # Caries is a mask task, so the mask branch is active.
    MASK_WEIGHT: 5.0
    DICE_WEIGHT: 5.0
    BOX_WEIGHT: 5.0
    GIOU_WEIGHT: 2.0
    HIDDEN_DIM: 256
    NUM_OBJECT_QUERIES: 50
    NHEADS: 8
    DROPOUT: 0.0
    DIM_FEEDFORWARD: 2048
    ENFORCE_INPUT_PROJ: False
    # Largest stride emitted by the backbone. Variants with a different
    # super-patch (Swin 224, ViT 224) override this.
    SIZE_DIVISIBILITY: 32
    DEC_LAYERS: 9
    TRAIN_NUM_POINTS: 12544
    OVERSAMPLE_RATIO: 3.0
    IMPORTANCE_SAMPLE_RATIO: 0.75
    INITIAL_PRED: True
    TWO_STAGE: True
    DN: "seg"
    DN_NUM: 100
    INITIALIZE_BOX_TYPE: "bitmask"
    TEST:
      SEMANTIC_ON: False
      INSTANCE_ON: True
      PANOPTIC_ON: False

# Unified downstream input protocol (see
# Docs/downstream_input_augmentation_protocol.md, section 3.1): every SSL
# method uses the same caries geometry. 448 = 14 x 32 aligns the shortest
# test edge with the DINOv2 ViT/14 token grid and the 32x detection stride;
# the 672 cap keeps the longest edge bounded after padding. Must stay in sync
# with configs/maskrcnn/caries/_base.yaml.
INPUT:
  DATASET_MAPPER_NAME: coco_instance_detr
  MIN_SIZE_TRAIN:
  - 352
  - 400
  - 448
  MIN_SIZE_TRAIN_SAMPLING: choice
  MAX_SIZE_TRAIN: 672
  MIN_SIZE_TEST: 448
  MAX_SIZE_TEST: 672
  MASK_FORMAT: polygon

DATALOADER:
  NUM_WORKERS: 4
  REPEAT_THRESHOLD: 0.05
  KEEP_NEGATIVE_RATIO: 0.1

# Unified downstream augmentation protocol (see
# Docs/downstream_input_augmentation_protocol.md, section 5.1). Mask R-CNN and
# MaskDINO share this caries policy, and it is identical for every SSL method:
# horizontal flip, mild small-angle rotation and mild brightness/contrast/gamma.
# Cropping, saturation, blur and JPEG compression stay closed so the fine lesion
# texture that defines the mask boundary is protected. Must stay in sync with
# configs/maskrcnn/caries/_base.yaml. Unset keys keep the module defaults.
AUGMENTATION:
  CARIES:
    ENABLED: true
    HORIZONTAL_FLIP_PROB: 0.5
    ROTATION_PROB: 0.2
    ROTATION_ANGLE: 5.0
    BRIGHTNESS_PROB: 0.2
    BRIGHTNESS_MIN: 0.90
    BRIGHTNESS_MAX: 1.10
    CONTRAST_PROB: 0.2
    CONTRAST_MIN: 0.90
    CONTRAST_MAX: 1.10
    # Protocol 5.1 keeps saturation, blur and JPEG off for caries.
    SATURATION_PROB: 0.0
    GAMMA_PROB: 0.2
    GAMMA_MIN: 0.90
    GAMMA_MAX: 1.10
    QUALITY_PROB: 0.0

DISTRIBUTED:
  NUM_GPUS: 2
  IMS_PER_GPU: 1

SOLVER:
  AMP:
    ENABLED: True
  BASE_LR: 0.00025
  MAX_ITER: 3000
  STEPS: []

TEST:
  EVAL_PERIOD: 1000

# Training logger: "tensorboard" or "swanlab".
LOGGER: swanlab
SWANLAB:
  PROJECT: dentmag
  WORKSPACE: "zykev"

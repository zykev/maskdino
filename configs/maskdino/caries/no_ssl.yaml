# Control: no SSL pretraining anywhere.
#
# ResNet-50 FPN with the plain ImageNet (torchvision) initialisation inherited
# from the COCO base config. Every SSL variant in this folder shares the same
# backbone/task head and differs only in how the image encoder is initialised.
#
# NOTE: if you want the fully supervised COCO MaskDINO R50 checkpoint instead,
# set SSL_METHOD to "none" and point MODEL.WEIGHTS at the MaskDINO model zoo
# entry. There is no such checkpoint in `.checkpoints/`, so the default here is
# the ImageNet encoder initialisation.
_BASE_: _base.yaml

MODEL:
  WEIGHTS: "detectron2://ImageNetPretrained/torchvision/R-50.pkl"
  BACKBONE:
    NAME: "build_resnet_backbone"
    SSL_METHOD: "none"
    USE_SSL_PRETRAINED: false

SWANLAB:
  NAME: "maskdino_caries"

OUTPUT_DIR: output/maskdino_caries

MODEL:
  WEIGHTS: .checkpoints/intraoral/model_final_280758.pkl #detectron2://COCO-Detection/faster_rcnn_R_50_FPN_3x/137849458/model_final_280758.pkl
  ROI_HEADS:
    # fasterrcnn_orth.py reads the actual class count from the train COCO JSON
    # and overwrites NUM_CLASSES automatically.
    NUM_CLASSES: 1
    BATCH_SIZE_PER_IMAGE: 256
    SCORE_THRESH_TEST: 0.5
  ANCHOR_GENERATOR:
    SIZES:
    - - 16
      - 32
      - 64
      - 128
      - 256

INPUT:
  MIN_SIZE_TRAIN:
  - 640
  - 800
  - 1024
  MAX_SIZE_TRAIN: 1333
  MIN_SIZE_TEST: 800
  MAX_SIZE_TEST: 1333

DATALOADER:
  NUM_WORKERS: 4
  FILTER_EMPTY_ANNOTATIONS: false
  SAMPLER_TRAIN: RepeatFactorTrainingSampler
  REPEAT_THRESHOLD: 0.05
  KEEP_NEGATIVE_RATIO: 0.5

SOLVER:
  IMS_PER_BATCH: 2
  BASE_LR: 0.0025
  MAX_ITER: 3000
  STEPS:
  - 2100
  - 2700
  GAMMA: 0.1
  WARMUP_ITERS: 200

TEST:
  EVAL_PERIOD: 200

OUTPUT_DIR: output/fasterrcnn_orth_v1

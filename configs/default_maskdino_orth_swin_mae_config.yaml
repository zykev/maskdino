_BASE_: default_maskdino_orth_base_config.yaml

MODEL:
  BACKBONE:
    NAME: "D2SwinMAEBackbone"
  SWIN:
    EMBED_DIM: 96
    DEPTHS: [2, 2, 2, 2]
    NUM_HEADS: [3, 6, 12, 24]
    WINDOW_SIZE: 7
    APE: False
    DROP_PATH_RATE: 0.1
    PATCH_NORM: True
    PRETRAIN_IMG_SIZE: 224
  # Set this to a Swin-MAE checkpoint when fine-tuning from MAE pretraining.
  # Decoder/reconstruction weights are ignored by D2SwinMAEBackbone.
  WEIGHTS: ""
  MaskDINO:
    SIZE_DIVISIBILITY: 224

WANDB:
  NAME: "maskdino_orth_swin_mae"

OUTPUT_DIR: output/maskdino_orth_swin_mae

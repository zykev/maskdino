MODEL:
  WEIGHTS: detectron2://COCO-InstanceSegmentation/mask_rcnn_R_50_FPN_3x/137849600/model_final_f10217.pkl
  MASK_ON: true
  ROI_HEADS:
    # maskrcnn_unified.py overwrites NUM_CLASSES from datasets_coco/datasets_to_coco.py.
    NUM_CLASSES: 1
    BATCH_SIZE_PER_IMAGE: 256
    POSITIVE_FRACTION: 0.5
    SCORE_THRESH_TEST: 0.5
    IOU_THRESHOLDS:
    - 0.3
    - 0.45
    IOU_LABELS:
    - 0
    - -1
    - 1
  RPN:
    IOU_THRESHOLDS:
    - 0.2
    - 0.6
  ANCHOR_GENERATOR:
    SIZES:
    - - 4
      - 8
      - 16
      - 32
      - 64

INPUT:
  MIN_SIZE_TRAIN:
  - 300
  - 400
  - 500
  MAX_SIZE_TRAIN: 600
  MIN_SIZE_TEST: 400
  MAX_SIZE_TEST: 600
  MASK_FORMAT: polygon

DATALOADER:
  NUM_WORKERS: 4
  FILTER_EMPTY_ANNOTATIONS: false
  SAMPLER_TRAIN: RepeatFactorTrainingSampler
  REPEAT_THRESHOLD: 0.1
  KEEP_NEGATIVE_RATIO: 0.1

SOLVER:
  IMS_PER_BATCH: 4
  BASE_LR: 0.005
  MAX_ITER: 20000
  STEPS:
  - 14000
  - 18000
  GAMMA: 0.1
  WARMUP_ITERS: 1000

TEST:
  EVAL_PERIOD: 500

OUTPUT_DIR: output/maskrcnn_caries

# SimCLRv2 ResNet-50 (sk_ratio=0.0625) image encoder.
#
# Same architecture as `no_ssl` (ResNet-50 C2-C5), so this isolates the effect
# of the SimCLRv2 pretraining. MODEL.WEIGHTS stays empty: only the encoder is
# restored, every detector head keeps its random initialisation.
_BASE_: _base.yaml

MODEL:
  WEIGHTS: ""
  BACKBONE:
    NAME: "build_resnet_ssl_fpn_backbone"
    SSL_METHOD: "simclr"
    USE_SSL_PRETRAINED: true
    SSL_WEIGHTS: "/home/zychen/Documents/intraoral_code/maskdino/.checkpoints/pretrain/simclr/resnet50_checkpoint-050.pth"
    # Dotted path of the encoder inside the checkpoint; the loader falls back
    # to auto-detection (with a warning) if this key does not resolve.
    SSL_CHECKPOINT_KEY: "model.backbone"
    SSL_STRICT_LOAD: true
    FREEZE_AT: 0
    FEATURE_NAMES: ["res2", "res3", "res4", "res5"]
  RESNET_SSL:
    DEPTH: 50
    WIDTH_MULTIPLIER: 1
    STEM_TYPE: "simclrv2"
    SK_RATIO: 0.0625
  FPN:
    IN_FEATURES: ["res2", "res3", "res4", "res5"]
    OUT_CHANNELS: 256

SWANLAB:
  NAME: "maskrcnn_caries_simclr"

OUTPUT_DIR: output/maskrcnn_caries_simclr

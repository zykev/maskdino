# Mask R-CNN / caries (single-tooth instance segmentation).
#
# Task-level settings only. Every variant in this folder adds its own backbone
# and pretraining block on top. The Detectron2 COCO challenge defaults
# (COCO-InstanceSegmentation/mask_rcnn_R_50_FPN_3x) are merged programmatically
# by `maskrcnn_unify._build_base_cfg()`, so no `_BASE_` line is needed here.

MODEL:
  # ROI_HEADS/RPN IOU_THRESHOLDS below only control which proposals count as
  # positive/negative training samples. COCOEvaluator always scores AP at the
  # fixed COCO IoU grid (0.50:0.05:0.95); changing these values does not
  # change how AP is computed.
  ROI_HEADS:
    BATCH_SIZE_PER_IMAGE: 256
    POSITIVE_FRACTION: 0.5
    SCORE_THRESH_TEST: 0.05
    IOU_THRESHOLDS:
    - 0.3
    - 0.45
    IOU_LABELS:
    - 0
    - -1
    - 1
  RPN:
    IOU_THRESHOLDS:
    - 0.2
    - 0.6
  ANCHOR_GENERATOR:
    SIZES:
    - - 4
      - 8
      - 16
      - 32
      - 64

# Unified downstream input protocol (see
# Docs/downstream_input_augmentation_protocol.md, section 3.1): every SSL
# method uses the same caries geometry. 448 = 14 x 32 aligns the shortest
# test edge with the DINOv2 ViT/14 token grid and the 32x detection stride;
# the 672 cap keeps the longest edge bounded after padding. Must stay in sync
# with configs/maskdino/caries/_base.yaml.
INPUT:
  MIN_SIZE_TRAIN:
  - 352
  - 400
  - 448
  MIN_SIZE_TRAIN_SAMPLING: choice
  MAX_SIZE_TRAIN: 672
  MIN_SIZE_TEST: 448
  MAX_SIZE_TEST: 672
  MASK_FORMAT: polygon

DATALOADER:
  NUM_WORKERS: 4
  SAMPLER_TRAIN: RepeatFactorTrainingSampler
  REPEAT_THRESHOLD: 0.1
  KEEP_NEGATIVE_RATIO: 0.1

# Unified downstream augmentation protocol (see
# Docs/downstream_input_augmentation_protocol.md, section 5.1). Mask R-CNN and
# MaskDINO share this caries policy, and it is identical for every SSL method:
# horizontal flip, mild small-angle rotation and mild brightness/contrast/gamma.
# Cropping, saturation, blur and JPEG compression stay closed so the fine lesion
# texture that defines the mask boundary is protected. Must stay in sync with
# configs/maskdino/caries/_base.yaml. Unset keys keep the module defaults.
AUGMENTATION:
  CARIES:
    ENABLED: true
    HORIZONTAL_FLIP_PROB: 0.5
    ROTATION_PROB: 0.2
    ROTATION_ANGLE: 5.0
    BRIGHTNESS_PROB: 0.2
    BRIGHTNESS_MIN: 0.90
    BRIGHTNESS_MAX: 1.10
    CONTRAST_PROB: 0.2
    CONTRAST_MIN: 0.90
    CONTRAST_MAX: 1.10
    # Protocol 5.1 keeps saturation, blur and JPEG off for caries.
    SATURATION_PROB: 0.0
    GAMMA_PROB: 0.2
    GAMMA_MIN: 0.90
    GAMMA_MAX: 1.10
    QUALITY_PROB: 0.0

DISTRIBUTED:
  NUM_GPUS: 1
  IMS_PER_GPU: 4

SOLVER:
  BASE_LR: 0.005
  MAX_ITER: 20000
  STEPS:
  - 14000
  - 18000
  GAMMA: 0.1
  WARMUP_ITERS: 1000

TEST:
  EVAL_PERIOD: 1000

# Training logger: "tensorboard" or "swanlab".
LOGGER: swanlab
SWANLAB:
  PROJECT: dentmag
  WORKSPACE: "zykev"

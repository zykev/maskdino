_BASE_: coco/instance-segmentation/Base-COCO-InstanceSegmentation.yaml
MODEL:
  META_ARCHITECTURE: "MaskDINO"
  BACKBONE:
    NAME: "D2SwinTransformer"
  SWIN:
    EMBED_DIM: 96
    DEPTHS: [2, 2, 6, 2]
    NUM_HEADS: [3, 6, 12, 24]
    WINDOW_SIZE: 7
    APE: False
    DROP_PATH_RATE: 0.2
    PATCH_NORM: True
    PRETRAIN_IMG_SIZE: 224
  # Set this to a standard Swin-T checkpoint, or pass MODEL.WEIGHTS on the
  # command line. For a Swin-MAE checkpoint, use the swin_mae config instead.
  WEIGHTS: "/home/zychen/Documents/intraoral_code/Swin-MAE/exp/swinmae_v1/checkpoint-400.pth"
  PIXEL_MEAN: [123.675, 116.280, 103.530]
  PIXEL_STD: [58.395, 57.120, 57.375]
  SEM_SEG_HEAD:
    NAME: "MaskDINOHead"
    IGNORE_VALUE: 255
    # maskdino_unify.py overwrites NUM_CLASSES from the orth train COCO JSON.
    NUM_CLASSES: 1
    LOSS_WEIGHT: 1.0
    CONVS_DIM: 256
    MASK_DIM: 256
    NORM: "GN"
    PIXEL_DECODER_NAME: "MaskDINOEncoder"
    DIM_FEEDFORWARD: 1024
    NUM_FEATURE_LEVELS: 4
    TOTAL_NUM_FEATURE_LEVELS: 5
    IN_FEATURES: ["res2", "res3", "res4", "res5"]
    DEFORMABLE_TRANSFORMER_ENCODER_IN_FEATURES: ["res3", "res4", "res5"]
    COMMON_STRIDE: 4
    TRANSFORMER_ENC_LAYERS: 3
    FEATURE_ORDER: "low2high"
  MaskDINO:
    TRANSFORMER_DECODER_NAME: "MaskDINODecoder"
    DEEP_SUPERVISION: True
    NO_OBJECT_WEIGHT: 0.1
    CLASS_WEIGHT: 4.0
    MASK_WEIGHT: 0.0
    DICE_WEIGHT: 0.0
    BOX_WEIGHT: 5.0
    GIOU_WEIGHT: 2.0
    COST_MASK_WEIGHT: 0.0
    COST_DICE_WEIGHT: 0.0
    HIDDEN_DIM: 256
    NUM_OBJECT_QUERIES: 30
    NHEADS: 8
    DROPOUT: 0.0
    DIM_FEEDFORWARD: 1024
    ENC_LAYERS: 0
    PRE_NORM: False
    ENFORCE_INPUT_PROJ: False
    SIZE_DIVISIBILITY: 32
    DEC_LAYERS: 4
    TRAIN_NUM_POINTS: 12544
    OVERSAMPLE_RATIO: 3.0
    IMPORTANCE_SAMPLE_RATIO: 0.75
    INITIAL_PRED: True
    TWO_STAGE: True
    DN: "standard"
    DN_NUM: 50
    INITIALIZE_BOX_TYPE: "mask2box"
    TEST:
      SEMANTIC_ON: False
      INSTANCE_ON: True
      PANOPTIC_ON: False
      OVERLAP_THRESHOLD: 0.8
      OBJECT_MASK_THRESHOLD: 0.5

INPUT:
  DATASET_MAPPER_NAME: "coco_instance_detr"
  MIN_SIZE_TRAIN:
  - 512
  - 640
  MAX_SIZE_TRAIN: 960
  MIN_SIZE_TEST: 640
  MAX_SIZE_TEST: 960
  MASK_FORMAT: polygon

DATALOADER:
  NUM_WORKERS: 4
  FILTER_EMPTY_ANNOTATIONS: false
  SAMPLER_TRAIN: RepeatFactorTrainingSampler
  REPEAT_THRESHOLD: 0.05
  KEEP_NEGATIVE_RATIO: 0.2

SOLVER:
  AMP:
    ENABLED: True
  IMS_PER_BATCH: 2
  BASE_LR: 0.00025
  MAX_ITER: 12000
  STEPS:
  - 8000
  - 11000
  GAMMA: 0.1
  WARMUP_ITERS: 500

TEST:
  EVAL_PERIOD: 1000

# Training logger: "tensorboard" or "wandb".
LOGGER: wandb
WANDB:
  PROJECT: maskdino
  ENTITY: "intraoral"
  NAME: "maskdino_orth_swin"

OUTPUT_DIR: output/maskdino_orth_swin

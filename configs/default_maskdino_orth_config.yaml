_BASE_: coco/instance-segmentation/Base-COCO-InstanceSegmentation.yaml
MODEL:
  META_ARCHITECTURE: "MaskDINO"
  SEM_SEG_HEAD:
    NAME: "MaskDINOHead"
    IGNORE_VALUE: 255
    # maskdino_unify.py overwrites NUM_CLASSES from the orth train COCO JSON.
    NUM_CLASSES: 1
    LOSS_WEIGHT: 1.0
    CONVS_DIM: 256
    MASK_DIM: 256
    NORM: "GN"
    PIXEL_DECODER_NAME: "MaskDINOEncoder"
    DIM_FEEDFORWARD: 1024
    NUM_FEATURE_LEVELS: 3
    TOTAL_NUM_FEATURE_LEVELS: 3
    IN_FEATURES: ["res2", "res3", "res4", "res5"]
    DEFORMABLE_TRANSFORMER_ENCODER_IN_FEATURES: ["res3", "res4", "res5"]
    COMMON_STRIDE: 4
    TRANSFORMER_ENC_LAYERS: 6
  MaskDINO:
    TRANSFORMER_DECODER_NAME: "MaskDINODecoder"
    DEEP_SUPERVISION: True
    NO_OBJECT_WEIGHT: 1.0
    CLASS_WEIGHT: 4.0
    MASK_WEIGHT: 0.0
    DICE_WEIGHT: 0.0
    BOX_WEIGHT: 5.0
    GIOU_WEIGHT: 2.0
    COST_MASK_WEIGHT: 0.0
    COST_DICE_WEIGHT: 0.0
    HIDDEN_DIM: 256
    NUM_OBJECT_QUERIES: 50
    NHEADS: 8
    DROPOUT: 0.0
    DIM_FEEDFORWARD: 2048
    ENC_LAYERS: 0
    PRE_NORM: False
    ENFORCE_INPUT_PROJ: False
    SIZE_DIVISIBILITY: 32
    DEC_LAYERS: 9
    TRAIN_NUM_POINTS: 12544
    OVERSAMPLE_RATIO: 3.0
    IMPORTANCE_SAMPLE_RATIO: 0.75
    INITIAL_PRED: True
    TWO_STAGE: True
    DN: "standard"
    DN_NUM: 100
    INITIALIZE_BOX_TYPE: "bitmask"
    TEST:
      SEMANTIC_ON: False
      INSTANCE_ON: True
      PANOPTIC_ON: False
      OVERLAP_THRESHOLD: 0.8
      OBJECT_MASK_THRESHOLD: 0.5

INPUT:
  DATASET_MAPPER_NAME: "coco_instance_detr"
  # Match Mask R-CNN orth input resolution for fair comparison.
  # Geometry stats support MIN_SIZE_TEST=800: resized bbox sqrt-area p10/p50/p90
  # is about 176/264/375 px, preserving enough detail for the observed boxes.
  MIN_SIZE_TRAIN:
  - 640
  - 800
  - 1024
  MAX_SIZE_TRAIN: 1333
  MIN_SIZE_TEST: 800
  MAX_SIZE_TEST: 1333
  MASK_FORMAT: polygon

DATALOADER:
  NUM_WORKERS: 4
  FILTER_EMPTY_ANNOTATIONS: false
  SAMPLER_TRAIN: RepeatFactorTrainingSampler
  REPEAT_THRESHOLD: 0.05
  KEEP_NEGATIVE_RATIO: 0.2

ORTH_CLASS_BALANCE:
  ENABLED: true
  BETA: 0.999
  CLIP_MIN: 0.25
  CLIP_MAX: 5.0
  LOSS_TYPE: positive_focal
  FOCAL_GAMMA: 2.0
  BACKGROUND_WEIGHT: 1.0

SOLVER:
  AMP:
    ENABLED: True
  IMS_PER_BATCH: 2
  BASE_LR: 0.00025
  MAX_ITER: 12000
  STEPS:
  - 8000
  - 11000
  GAMMA: 0.1
  WARMUP_ITERS: 500

TEST:
  EVAL_PERIOD: 1000

# Training logger: "tensorboard" or "wandb".
LOGGER: wandb
WANDB:
  PROJECT: maskdino
  ENTITY: "intraoral"
  NAME: "maskdino_orth_resnet"

OUTPUT_DIR: output/maskdino_orth_resnet
